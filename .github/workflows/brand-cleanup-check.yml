name: Brand cleanup check

on:
  push:
    branches:
      - fix/elivate-brand-cleanup

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reject legacy template brand references
        shell: bash
        run: |
          if grep -RniE 'Meridian|meridian' package.json package-lock.json README.md src public astro.config.mjs; then
            echo 'Legacy template brand references remain.'
            exit 1
          fi

      - name: Build Astro site
        run: npm run build
