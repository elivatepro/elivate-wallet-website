name: Fix review follow-ups

on:
  push:
    branches:
      - fix/elivate-brand-cleanup

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove broken stock logo reference and add Pages redirect
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/components/mockups/dashboard.tsx')
          text = path.read_text()
          pattern = re.compile(
              r'<img\s+src="/logo\.svg"\s+alt="Logo"\s+className="size-6 rounded bg-neutral-100 p-0\.5"\s*/>',
              re.MULTILINE,
          )
          replacement = '''<span
                aria-hidden="true"
                className="flex size-6 items-center justify-center rounded bg-neutral-100 text-[0.65rem] font-semibold text-neutral-900"
              >
                E
              </span>'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected exactly one dashboard logo block, found {count}')
          path.write_text(text)

          Path('public/_redirects').write_text('/product /features 301\n')
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify legacy brand is gone
        shell: bash
        run: |
          if grep -RniE 'Meridian|meridian' package.json package-lock.json README.md src public astro.config.mjs; then
            echo 'Legacy template brand references remain.'
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Commit fixes and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/fix-review-followups.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Address brand cleanup review follow-ups'
          git push
