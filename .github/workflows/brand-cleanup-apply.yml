name: Apply legacy-name cleanup

on:
  push:
    branches:
      - fix/elivate-brand-cleanup

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply safe internal renames
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              'src/hooks/use-loader-ready.ts',
              'src/lib/highlighter.ts',
              'src/styles/global.css',
              'src/components/ui/alert-dialog.tsx',
              'src/components/sections/home/rift.tsx',
              'src/components/sections/home/comparison.tsx',
              'src/components/sections/home/notch.tsx',
              'src/components/sections/home/hero-alt.tsx',
              'src/components/sections/home/spec.tsx',
              'src/components/sections/home/voices.tsx',
              'src/components/sections/home/bulletin.tsx',
              'src/components/sections/home/night-shift.tsx',
              'src/components/sections/home/hero.tsx',
              'src/components/sections/home/spec-images.tsx',
              'src/components/sections/product/oracle.tsx',
              'src/components/sections/product/cta.tsx',
              'src/components/sections/pricing/ledger.tsx',
              'src/components/mdx/motion-steps.tsx',
              'src/components/mockups/log-stream.tsx',
              'src/components/mockups/watch-alert.tsx',
              'src/components/mockups/console.tsx',
          ]

          for name in paths:
              path = Path(name)
              if not path.exists():
                  continue
              text = path.read_text()
              text = text.replace('MERIDIAN', 'ELIVATE')
              text = text.replace('Meridian', 'Elivate')
              text = text.replace('meridian', 'elivate')
              path.write_text(text)

          lock = Path('package-lock.json')
          text = lock.read_text().replace('meridian-astro-template', 'elivate-wallet-website')
          lock.write_text(text)
          PY

          if [ -f src/components/layout/meridian-frame.tsx ]; then
            git mv src/components/layout/meridian-frame.tsx src/components/layout/elivate-frame.tsx
            python3 - <<'PY'
          from pathlib import Path
          path = Path('src/components/layout/elivate-frame.tsx')
          text = path.read_text()
          text = text.replace('MERIDIAN', 'ELIVATE').replace('Meridian', 'Elivate').replace('meridian', 'elivate')
          path.write_text(text)
          PY
          fi

          git rm -f src/lib/meridian-canvas.ts src/components/icons/meridian-logo.tsx src/components/icons/meridian-mark.tsx || true

      - name: Commit safe cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove remaining safe Meridian implementation references'
          git push
