name: Apply legacy-name cleanup

on:
  push:
    branches:
      - fix/elivate-brand-cleanup

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove legacy content and assets
        shell: bash
        run: |
          # These pages describe Meridian's unrelated telemetry product and
          # must not be relabelled as Elivate Wallet legal/docs content.
          git rm -rf src/content/docs src/pages/docs src/content/legal src/pages/legal || true

          # Remove the purchased template's visual identity until confirmed
          # Elivate Wallet logo/favicon/social artwork is supplied.
          git rm -f public/logo.svg public/og-image.jpg || true
          git rm -rf public/favicon || true

          # The approved information architecture exposes the repurposed
          # product page at /features.
          if [ -f src/pages/product.astro ] && [ ! -f src/pages/features.astro ]; then
            git mv src/pages/product.astro src/pages/features.astro
          fi

          python3 - <<'PY'
          from pathlib import Path

          feature = Path('src/pages/features.astro')
          if feature.exists():
              text = feature.read_text()
              text = text.replace('title="Product"', 'title="Features"')
              text = text.replace(
                  'description="Logs, metrics, and traces in one keyboard-first console. ⌘K to anywhere, SLO-native paging, auto-drafted post-mortems shipped to Linear."',
                  'description="Manage member balances, transactions, withdrawals, records, and network-wide financial visibility in one place."',
              )
              feature.write_text(text)

          # Update internal links now that /product is /features.
          for path in Path('src').rglob('*'):
              if not path.is_file() or path.suffix not in {'.astro', '.ts', '.tsx', '.js', '.jsx', '.md', '.mdx'}:
                  continue
              text = path.read_text()
              updated = text.replace('"/product', '"/features').replace("'/product", "'/features")
              if updated != text:
                  path.write_text(updated)
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove remaining Meridian content and assets'
          git push